name: Terraform plan + AI review

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "scripts/ai-review/**"
      - ".github/workflows/terraform-review.yml"

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-2

jobs:
  plan-and-review:
    runs-on: ubuntu-latest
    # 포크 PR에서는 시크릿이 없으므로 실행하지 않음
    if: github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      # plan 전용 읽기 권한 자격증명을 별도 시크릿으로 사용 (deploy용 키와 분리)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -lock=false > plan.txt

      - name: Checkov scan
        run: |
          pip install checkov
          checkov -d . --framework terraform --compact --quiet > checkov.txt || true

      - name: AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python ../../scripts/ai-review/review_plan.py plan.txt checkov.txt > review.md

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md
