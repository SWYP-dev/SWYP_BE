<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>취합 채용공고 마감 알림</title>
</head>
<body style="margin:0; padding:0; background:#F6F6F7; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; color:#212123;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#F6F6F7" style="width:100%; background:#F6F6F7; font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif; color:#212123;">
    <tr>
      <td align="center" style="padding:24px; text-align:left;">
  <div style="max-width:652px; margin:0 auto;">

    <div style="padding:36px; background:#FFFFFF; border-radius:16px;">

      <!-- Header -->
      <div style="padding:0 0 20px; border-bottom:1px solid #E9EBEC; margin:0 0 24px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
          <tr>
            <td style="width:113px; vertical-align:middle;"><img src="cid:chwihap-text-logo" width="113" height="20" alt="Chwihap" style="display:block; border:0;"></td>
          </tr>
        </table>
      </div>

      <!-- Title -->
      <h1 style="margin:0 0 6px; font-weight:700; font-size:24px; line-height:1.4; color:#212123;">마감 임박 공고가 {{totalCount}}건 있어요</h1>
      <p style="margin:0 0 24px; font-weight:500; font-size:17px; line-height:1.4; color:#616164;">{{summaryText}}</p>

      <!-- DeadlineList -->
      {{groupsHtml}}

      <!-- Button -->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%; margin:24px 0 0;">
        <tr>
          <td style="height:48px; background:#4864F1; border-radius:8px; text-align:center; vertical-align:middle;">
            <a href="https://www.chwihap.com/deadlines" style="display:block; padding:12px; font-weight:600; font-size:16px; line-height:1.5; color:#FFFFFF; text-decoration:none; text-align:center;">지원 마감일에서 모아보기</a>
          </td>
        </tr>
      </table>
    </div>

    <p style="margin:20px 0 0; font-weight:500; font-size:11px; line-height:1.5; text-align:center; color:#616164;">Copyright &copy; Chwihap. All rights reserved.</p>
  </div>
      </td>
    </tr>
  </table>
</body>
</html>
