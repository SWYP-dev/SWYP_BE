upstream app_upstream {
    include /etc/nginx/blue-green/active_upstream.conf;
}

server {
    listen 80;
    server_name api.chwihap.com;

    # certbot webroot 인증용 — 인증서 발급/갱신 시 이 경로로 요청이 옴
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.chwihap.com;

    ssl_certificate     /etc/letsencrypt/live/api.chwihap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chwihap.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://app_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
